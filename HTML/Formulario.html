<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda de Juegos de Mesa</title>
    <link rel="stylesheet" href="../CSS/Formulario.css">
    <link rel="stylesheet" href="../CSS/header_footer.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="../JS/JuegosFiltrados.js"></script>
</head>

<body>
    <header>
        <div class="logo">
            <h1>Rastreator Juegos</h1>
        </div>
        <div class="iconos">
            <a href="./Formulario.html">
                <img id="lupa" src="../IMAGENES/lupa.png" alt="icono de búsqueda">
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./Lista.html">Lista</a></li>
                <li><a href="https://dado.online/">Dado</a></li>
                <li><a href="https://melodice.org/">Música</a></li>
                <li><a href="https://es.piliapp.com/random/wheel/">Ruletita</a></li>
            </ul>
        </nav>
    </header>
    <div class="formulario">
        <h2>Búsqueda de Juego</h2>
        <form id="formBusqueda">
            <label for="propietario">Propietario:</label>
            <select id="propietario" name="propietario">
                <option value="Todos">Todos</option>
                <option value="Alba">Alba</option>
                <option value="Laura">Laura</option>
                <option value="Judío">Judío</option>
                <option value="Roberto">Roberto</option>
                
            </select>

            <label for="dificultad">Dificultad:</label>
            <select id="dificultad" name="dificultad">
                <option value="Todos">Todos</option>
                <option value="Fácil">Fácil</option>
                <option value="Media">Media</option>
                <option value="Difícil">Difícil</option>
            </select>

            <label for="duracion">Duración:</label>
            <select id="duracion" name="duracion">
                <option value="Todos">Todos</option>
                <option value="Poca">Poca (5-10 minutos)</option>
                <option value="Media">Media (30-45 minutos)</option>
                <option value="Mucha">Mucha (+1 hora)</option>
            </select>

            <!-- Campo de número de jugadores -->
            <label for="jugadores">Número de jugadores:</label>
            <input type="number" id="jugadores" name="jugadores" min="1" placeholder="Número de jugadores">

            <button type="button" onclick="filtrarJuegos()">Buscar</button>

        </form>
    </div>

    <div id="juegosContainer" class="juegosContainer">
    </div>

    
</body>

</html>
